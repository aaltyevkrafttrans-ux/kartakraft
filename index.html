<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг ставок логистики</title>
    <!-- Подключаем стили карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 380px; background: #f8f9fa; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        h2 { margin-top: 0; font-size: 18px; color: #333; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }
        input, select, button { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #0066cc; color: white; border: none; font-weight: 600; cursor: pointer; margin-top: 5px; }
        button:hover { background: #0052a3; }
        button.secondary { background: #6c757d; margin-top: 8px; font-size: 12px; padding: 6px; }
        .stats-box { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-top: 15px; }
        .route-card { border-bottom: 1px solid #eee; padding: 10px 0; }
        .route-card:last-child { border-bottom: none; }
        .route-title { font-weight: bold; color: #222; display: flex; justify-content: space-between; }
        .route-avg { color: #28a745; font-weight: bold; font-size: 15px; }
        .route-meta { font-size: 12px; color: #777; margin-top: 4px; }
        .history-list { font-size: 11px; color: #555; margin-top: 5px; padding-left: 12px; }
        .btn-del { color: #dc3545; cursor: pointer; font-size: 11px; text-decoration: underline; background: none; border: none; padding: 0; width: auto; display: inline; }
        #loading { display: none; color: #0066cc; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>🚛 Добавить ставку перевозчика</h2>
    <div class="form-group">
        <label>Откуда (Город)</label>
        <input type="text" id="origin" placeholder="Например: Воронеж">
    </div>
    <div class="form-group">
        <label>Куда (Город)</label>
        <input type="text" id="destination" placeholder="Например: Мерсин">
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 2;">
            <label>Ставка</label>
            <input type="number" id="price" placeholder="3500">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Валюта</label>
            <select id="currency">
                <option value="$">$</option>
                <option value="€">€</option>
                <option value="₽">₽</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label>Дата котировки</label>
        <input type="date" id="date">
    </div>
    <div class="form-group">
        <label>Комментарий (тип авто, перевозчик)</label>
        <input type="text" id="note" placeholder="Тент 90м3, ООО Транс">
    </div>
    <button onclick="addRate()">Сохранить ставку на карту</button>
    <div id="loading">⏳ Ищем координаты городов...</div>

    <hr style="width: 100%; border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

    <h2>📊 Аналитика и ориентиры</h2>
    <div class="form-group">
        <label>Показать среднюю цену за период:</label>
        <select id="periodFilter" onchange="renderAll()">
            <option value="7">За последние 7 дней (эта неделя)</option>
            <option value="30" selected>За последние 30 дней</option>
            <option value="365">За весь год (365 дней)</option>
            <option value="all">За все время</option>
        </select>
    </div>
    <div class="form-group">
        <input type="text" id="searchFilter" placeholder="🔍 Поиск маршрута (напр. Стамбул)..." oninput="renderAll()">
    </div>

    <div id="routesList" class="stats-box"></div>

    <div style="display: flex; gap: 10px; margin-top: auto;">
        <button class="secondary" onclick="exportData()">💾 Скачать базу (JSON)</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">📂 Загрузить базу</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>
</div>

<div id="map"></div>

<!-- Подключаем скрипт карты Leaflet -->
<script src="https://unpkg.com"></script>
<script>
    // Инициализация карты (центр - условно между РФ и Турцией)
    const map = L.map('map').setView([45.0, 38.0], 4);
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Слой для линий и маркеров
    let mapLayer = L.layerGroup().addTo(map);

    // Установка сегодняшней даты по умолчанию
    document.getElementById('date').valueAsDate = new Date();

    // Загрузка данных из памяти браузера + демо-данные при первом запуске
    let rates = JSON.parse(localStorage.getItem('freightRates')) || [
        { id: 1, origin: 'Москва', origCoords: [55.7558, 37.6173], dest: 'Стамбул', destCoords: [41.0082, 28.9784], price: 3200, currency: '$', date: new Date().toISOString().split('T')[0], note: 'Демо: Тент 90 куб' },
        { id: 2, origin: 'Воронеж', origCoords: [51.6608, 39.2003], dest: 'Мерсин', destCoords: [36.8121, 34.6415], price: 2900, currency: '$', date: new Date().toISOString().split('T')[0], note: 'Демо: Реф' }
    ];
    let cityCache = JSON.parse(localStorage.getItem('cityCoordsCache')) || {
        'москва': [55.7558, 37.6173], 'стамбул': [41.0082, 28.9784],
        'воронеж': [51.6608, 39.2003], 'мерсин': [36.8121, 34.6415],
        'измир': [38.4237, 27.1428], 'ижевск': [56.8527, 53.2115]
    };

    // Функция поиска координат города через бесплатный API OpenStreetMap
    async function getCoords(city) {
        const key = city.trim().toLowerCase();
        if (cityCache[key]) return cityCache[key];

        const res = await fetch(`https://openstreetmap.org{encodeURIComponent(city)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
            const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            cityCache[key] = coords;
            localStorage.setItem('cityCoordsCache', JSON.stringify(cityCache));
            return coords;
        }
        throw new Error(`Город "${city}" не найден`);
    }

    async function addRate() {
        const origin = document.getElementById('origin').value.trim();
        const dest = document.getElementById('destination').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const currency = document.getElementById('currency').value;
        const date = document.getElementById('date').value;
        const note = document.getElementById('note').value.trim();

        if (!origin || !dest || !price || !date) {
            alert('Пожалуйста, заполните города, ставку и дату.');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        try {
            const origCoords = await getCoords(origin);
            const destCoords = await getCoords(dest);

            rates.push({
                id: Date.now(),
                origin: origin.charAt(0).toUpperCase() + origin.slice(1),
                origCoords,
                dest: dest.charAt(0).toUpperCase() + dest.slice(1),
                destCoords,
                price, currency, date, note
            });

            saveAndRender();
            document.getElementById('price').value = '';
            document.getElementById('note').value = '';
        } catch (e) {
            alert(e.message + '. Проверьте правильность написания.');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function deleteRate(id) {
        rates = rates.filter(r => r.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('freightRates', JSON.stringify(rates));
        renderAll();
    }

    function renderAll() {
        mapLayer.clearLayers();
        const listContainer = document.getElementById('routesList');
        listContainer.innerHTML = '';

        const daysFilter = document.getElementById('periodFilter').value;
        const search = document.getElementById('searchFilter').value.toLowerCase();
        const now = new Date();

        // Фильтрация по дате и поиску
        const filtered = rates.filter(r => {
            const routeName = `${r.origin} ${r.dest}`.toLowerCase();
            if (search && !routeName.includes(search)) return false;
            if (daysFilter === 'all') return true;
            const diffDays = (now - new Date(r.date)) / (1000 * 60 * 60 * 24);
            return diffDays <= parseInt(daysFilter);
        });

        // Группировка по маршрутам
        const grouped = {};
        filtered.forEach(r => {
            const key = `${r.origin} → ${r.dest} (${r.currency})`;
            if (!grouped[key]) grouped[key] = { items: [], origCoords: r.origCoords, destCoords: r.destCoords, currency: r.currency, title: `${r.origin} → ${r.dest}` };
            grouped[key].items.push(r);
        });

        if (Object.keys(grouped).length === 0) {
            listContainer.innerHTML = '<div style="color:#888; font-size:13px;">Нет данных за выбранный период.</div>';
            return;
        }

        // Отрисовка маршрутов на карте и в списке

for (const key in grouped) {
const group = grouped[key];
const sum = group.items.reduce((acc, item) => acc + item.price, 0);
const avg = Math.round(sum / group.items.length);
const min = Math.min(...group.items.map(i => i.price));
const max = Math.max(...group.items.map(i => i.price));
// Рисуем линию на карте
const polyline = L.polyline([group.origCoords, group.destCoords], {
color: '#0066cc', weight: 3, opacity: 0.75
}).addTo(mapLayer);
// Всплывающее окно при клике на линию на карте
polyline.bindPopup(<b>${group.title}</b><br> Средняя ставка: <b>${avg} ${group.currency}</b><br> Мин/Макс: ${min} – ${max} ${group.currency}<br> Замеров: ${group.items.length});
// Точки городов
L.circleMarker(group.origCoords, { radius: 5, color: '#28a745', fillOpacity: 1 }).addTo(mapLayer);
L.circleMarker(group.destCoords, { radius: 5, color: '#dc3545', fillOpacity: 1 }).addTo(mapLayer);
// Карточка в боковом меню
const historyHtml = group.items
.sort((a, b) => new Date(b.date) - new Date(a.date))
.map(i => <li>${i.date}: <b>${i.price}${i.currency}</b> ${i.note ? (${i.note}) : ''} <button class="btn-del" onclick="deleteRate(${i.id})">удалить</button></li>)
.join('');
listContainer.innerHTML += <div class="route-card"> <div class="route-title"> <span>${group.title}</span> <span class="route-avg">~ ${avg} ${group.currency}</span> </div> <div class="route-meta">Диапазон: ${min}–${max} ${group.currency} | Котировок: ${group.items.length}</div> <ul class="history-list">${historyHtml}</ul> </div>;
}
}
// Экспорт и импорт базы
function exportData() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rates, null, 2));
const a = document.createElement('a');
a.setAttribute("href", dataStr);
a.setAttribute("download", stavki_baza_${new Date().toISOString().split('T')[0]}.json);
document.body.appendChild(a);
a.click();
a.remove();
}
function importData(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
try {
rates = JSON.parse(e.target.result);
saveAndRender();
alert('База успешно загружена!');
} catch (err) {
alert('Ошибка чтения файла.');
}
};
reader.readAsText(file);
}
renderAll();
